[project]
name = "speakez-api"
version = "0.1.0"
description = "SpeakEz API: anonymous, place-based voice notes for UMN"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "geoalchemy2>=0.15",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["safety/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
