[project]
name = "speakez-api"
version = "0.1.0"
description = "SpeakEz API: anonymous, place-based voice notes for UMN"
# 3.10 floor so the GPU worker can install this package in a Colab runtime.
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13",
  "arq>=0.26",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "geoalchemy2>=0.15",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "PyJWT>=2.10,<3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "fakeredis[lua]>=2.26",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["safety/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
